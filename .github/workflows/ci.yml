name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Workspace-wide fmt/clippy stay advisory until C01b clears the debt across
  # ~130 crates. Do not silently drop `-D warnings` here.
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
            ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (workspace, advisory)
        run: cargo clippy --workspace --all-targets -- -D warnings

  ci:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Hard gate for C02–C08 front-end work.
      # niao_ir / niao_vm / niao_interpreter depend on niao_runtime, which currently
      # pulls niao_speech/niao_tts (alsa, whisper, espeak). Those stay in the
      # advisory `lint` job / full check until speech is feature-gated (follow-up).
      - name: Clippy (core)
        shell: bash
        run: |
          set -euo pipefail
          for crate in niao_lexer niao_parser niao_ast niao_errors niao_bytecode; do
            echo "::group::clippy $crate"
            cargo clippy -p "$crate" --all-targets --no-deps -- -D warnings
            echo "::endgroup::"
          done

      - name: Clippy (engines, advisory)
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for crate in niao_ir niao_vm niao_interpreter; do
            echo "::group::clippy $crate"
            cargo clippy -p "$crate" --all-targets --no-deps -- -D warnings
            echo "::endgroup::"
          done

      - name: Install native deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libclang-dev cmake pkg-config

      - name: Check
        run: cargo check --workspace

      - name: Test
        run: cargo test --workspace

      - name: Release build (cli + nm)
        run: cargo build --release --no-default-features -p niao_cli -p niao_nm

      - name: Language tests
        shell: bash
        run: |
          if [[ -f ./target/release/niao.exe ]]; then
            ./target/release/niao.exe test tests
          else
            ./target/release/niao test tests
          fi
