[workspace]
resolver = "2"
members = [
    "crates/niao_ast",
    "crates/niao_errors",
    "crates/niao_codec",
    "crates/niao_json_core",
    "crates/niao_crypto",
    "crates/niao_regex",
    "crates/niao_time",
    "crates/niao_http",
    "crates/niao_ws",
    "crates/niao_io",
    "crates/niao_db",
    "crates/niao_archive",
    "crates/niao_bignum",
    "crates/niao_net_clients",
    "crates/niao_rand",
    "crates/niao_args",
    "crates/niao_collections",
    "crates/niao_log",
    "crates/niao_lexer",
    "crates/niao_parser",
    "crates/niao_runtime",
    "crates/niao_interpreter",
    "crates/niao_ir",
    "crates/niao_bytecode",
    "crates/niao_vm",
    "crates/niao_format",
    "crates/niao_lint",
    "crates/niao_docs",
    "crates/niao_web",
    "crates/niao_cli",
    "crates/niao_pkg",
    "crates/niao_nm",
    "crates/ahiru_core",
    "crates/niao_tensor",
    "crates/niao_ml",
    "crates/niao_classic",
    "crates/niao_data",
    "crates/niao_graph",
    "crates/niao_rag",
    "crates/niao_llm",
    "crates/niao_num",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
license = "MIT"
authors = ["Niao Contributors"]

[workspace.dependencies]
niao_ast = { path = "crates/niao_ast" }
niao_errors = { path = "crates/niao_errors" }
niao_codec = { path = "crates/niao_codec" }
niao_json_core = { path = "crates/niao_json_core" }
niao_crypto = { path = "crates/niao_crypto" }
niao_regex = { path = "crates/niao_regex" }
niao_time = { path = "crates/niao_time" }
niao_http = { path = "crates/niao_http" }
niao_ws = { path = "crates/niao_ws" }
niao_io = { path = "crates/niao_io" }
niao_db = { path = "crates/niao_db" }
niao_archive = { path = "crates/niao_archive" }
niao_bignum = { path = "crates/niao_bignum" }
niao_net_clients = { path = "crates/niao_net_clients" }
niao_rand = { path = "crates/niao_rand" }
niao_args = { path = "crates/niao_args" }
niao_collections = { path = "crates/niao_collections" }
niao_log = { path = "crates/niao_log" }
niao_lexer = { path = "crates/niao_lexer" }
niao_parser = { path = "crates/niao_parser" }
niao_runtime = { path = "crates/niao_runtime" }
niao_interpreter = { path = "crates/niao_interpreter" }
niao_ir = { path = "crates/niao_ir" }
niao_bytecode = { path = "crates/niao_bytecode" }
niao_vm = { path = "crates/niao_vm", default-features = false }
niao_format = { path = "crates/niao_format" }
niao_lint = { path = "crates/niao_lint" }
niao_docs = { path = "crates/niao_docs" }
niao_web = { path = "crates/niao_web" }
niao_pkg = { path = "crates/niao_pkg" }
ahiru_core = { path = "crates/ahiru_core" }
niao_nm = { path = "crates/niao_nm" }
niao_tensor = { path = "crates/niao_tensor" }
niao_ml = { path = "crates/niao_ml" }
niao_classic = { path = "crates/niao_classic" }
niao_data = { path = "crates/niao_data" }
niao_graph = { path = "crates/niao_graph" }
niao_rag = { path = "crates/niao_rag" }
niao_llm = { path = "crates/niao_llm" }
niao_num = { path = "crates/niao_num" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
hf-hub = { path = "vendor/hf-hub" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
