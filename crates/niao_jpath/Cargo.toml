[package]
name = "niao_jpath"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "JSONPath / JMESPath queries, JSON Pointer and JSON Patch over values"

[lib]
bench = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
json-patch = "4.2"
jsonpath_lib2 = "0.3"
jmespath = { version = "0.5", features = ["sync"] }
niao_parallel = { workspace = true }

[[bin]]
name = "jpath_bench"
path = "src/bin/jpath_bench.rs"
