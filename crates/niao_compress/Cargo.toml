[package]
name = "niao_compress"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Modern compression: zstd, lz4, brotli, xz — block and stream APIs"

[lib]
bench = false

[dependencies]
brotli = "7"
lz4_flex = { version = "0.11", features = ["frame", "checked-decode"] }
niao_parallel = { workspace = true }
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"

[[bin]]
name = "ncompress_bench"
path = "src/bin/ncompress_bench.rs"
