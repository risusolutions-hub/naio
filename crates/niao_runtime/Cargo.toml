[package]
name = "niao_runtime"
version.workspace = true
edition.workspace = true

[dependencies]
niao_ast = { workspace = true }
niao_errors = { workspace = true }
niao_codec = { workspace = true }
niao_crypto = { workspace = true }
niao_json_core = { workspace = true }
niao_regex = { workspace = true }
niao_time = { workspace = true }
niao_http = { workspace = true }
niao_ws = { workspace = true }
niao_io = { workspace = true }
niao_db = { workspace = true }
niao_archive = { workspace = true }
niao_bignum = { workspace = true }
niao_collections = { workspace = true }
niao_net_clients = { workspace = true }
niao_parser = { workspace = true }
memmap2 = "0.9"
im-rc = "15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pki-types = "1"
lettre = { version = "0.11", default-features = false, features = ["rustls-tls", "smtp-transport", "builder"] }
rusqlite = { version = "0.32", features = ["bundled", "backup", "blob", "functions", "limits"] }
rayon = "1"
mongodb = { version = "3.1", optional = true }
bson = { version = "2.13", optional = true }
futures = { version = "0.3", optional = true }
ahiru_core = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
niao_tensor = { path = "../niao_tensor" }
niao_ml = { path = "../niao_ml" }
niao_classic = { path = "../niao_classic" }
niao_data = { path = "../niao_data" }
niao_graph = { path = "../niao_graph" }
niao_rag = { path = "../niao_rag", optional = true }
niao_llm = { path = "../niao_llm", optional = true }
niao_num = { workspace = true }
niao_stats = { workspace = true }
niao_frame = { workspace = true }
niao_optim = { workspace = true }
niao_plot = { workspace = true }

[features]
default = []
nmongo = ["dep:mongodb", "dep:bson", "dep:futures"]
nrag = ["dep:niao_rag"]
nllm = ["dep:niao_llm"]
nllm-llama = ["nllm", "niao_llm/llama"]
nllm-cuda = ["nllm", "nllm-llama", "niao_llm/cuda"]
nllm-vulkan = ["nllm", "nllm-llama", "niao_llm/vulkan"]
nml-cuda = ["niao_tensor/cuda", "niao_ml/cuda"]
nml-wgpu = ["niao_tensor/wgpu", "niao_ml/wgpu"]
