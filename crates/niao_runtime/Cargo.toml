niao_geo = { workspace = true }
niao_hub = { workspace = true }
niao_glob = { workspace = true }
niao_hdf5 = { workspace = true }
niao_html = { workspace = true }
niao_ical = { workspace = true }
niao_id = { workspace = true }
niao_ipaddr = { workspace = true }
niao_jpath = { workspace = true }
niao_jwt = { workspace = true }
niao_mime = { workspace = true }
niao_msgpack = { workspace = true }
niao_ncrypt = { workspace = true }
niao_oauth = { workspace = true }
niao_onnx = { workspace = true }
niao_auth = { workspace = true }
niao_otp = { workspace = true }
niao_parallel = { workspace = true }
niao_parquet = { workspace = true }
niao_pass = { workspace = true }
niao_pdf = { workspace = true }
niao_proto = { workspace = true }
niao_rand = { workspace = true }
niao_reflect = { workspace = true }
niao_req = { workspace = true }
niao_scrape = { workspace = true }
niao_search = { workspace = true }
niao_retry = { workspace = true }
niao_tune = { workspace = true }
niao_rpc = { workspace = true }
niao_sanitize = { workspace = true }
niao_sign = { workspace = true }
niao_speech = { workspace = true }
niao_tts = { workspace = true }
niao_signal = { workspace = true }
niao_sorted = { workspace = true }
niao_docstore = { workspace = true }
niao_tar = { workspace = true }
niao_textdiff = { workspace = true }
niao_unicode = { workspace = true }
