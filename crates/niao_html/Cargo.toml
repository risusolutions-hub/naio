[package]
name = "niao_html"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Forgiving HTML5 parser, CSS selectors, tree walking, text extraction, escape/unescape"

[lib]
bench = false

[dependencies]
scraper = "0.21"
v_htmlescape = "0.15"
html-escape = "0.2"
ego-tree = "0.9"
niao_parallel = { workspace = true }

[[bin]]
name = "html_bench"
path = "src/bin/html_bench.rs"
