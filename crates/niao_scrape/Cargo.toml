[package]
name = "niao_scrape"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Polite scraping: robots.txt, rate limits, retries, sitemap crawl, article/readability extraction"

[lib]
bench = false

[dependencies]
niao_http = { workspace = true }
niao_req = { workspace = true }
niao_parallel = { workspace = true }
scraper = "0.21"
quick-xml = { version = "0.37", features = ["serialize"] }

[[bin]]
name = "nscrape_bench"
path = "src/bin/nscrape_bench.rs"
