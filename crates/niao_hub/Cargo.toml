[package]
name = "niao_hub"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Model/dataset hub downloads for Niao (HF Hub + direct URLs, cache, checksums)"

[lib]
bench = false

[dependencies]
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
niao_crypto = { workspace = true }
niao_glob = { workspace = true }
thiserror = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
niao_http = { workspace = true }

[[bin]]
name = "nhub_bench"
path = "src/bin/nhub_bench.rs"
