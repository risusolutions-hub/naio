[package]
name = "ahiru_core"
version.workspace = true
edition.workspace = true
description = "High-performance HTTP/WebSocket server core for Niao ahiru-server"

[dependencies]
axum = { workspace = true, features = ["ws", "multipart"] }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "set-header", "compression-gzip", "compression-br", "fs"] }
hyper = { version = "1", features = ["server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
niao_codec = { workspace = true }
niao_json_core = { workspace = true }
niao_crypto = { workspace = true }
niao_db = { workspace = true }
dashmap = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "postgres", "sqlite"] }
niao_log = { workspace = true }

[features]
default = []
redis = []
