[package]
name = "niao_tts"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Text-to-speech via piper/espeak for Niao (ntts)"

[lib]
bench = false

[dependencies]
thiserror = "2"
hound = "3.5"
cpal = "0.15"
piper-rs = "0.2.0"
espeak-rs = "0.2.0"
espeak-rs-sys = "0.2.0"
serde_json = "1"

[[bin]]
name = "ntts_bench"
path = "src/bin/ntts_bench.rs"
