[package]
name = "niao_view"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Jinja-style templating: inheritance, blocks, filters, autoescape, partials for HTML/text (~jinja2 subset)"

[lib]
bench = false

[dependencies]
minijinja = { version = "2.21", features = ["speedups"] }
serde_json = "1"
niao_parallel = { workspace = true }

[[example]]
name = "view_bench"
path = "examples/view_bench.rs"

