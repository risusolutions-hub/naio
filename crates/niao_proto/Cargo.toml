[package]
name = "niao_proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol Buffers codec + codegen for Niao (prost-backed)"

[dependencies]
prost = "0.13"
prost-types = "0.13"
prost-reflect = { version = "0.14", features = ["serde"] }
protox = "0.7"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[[bin]]
name = "nproto_bench"
path = "src/bin/nproto_bench.rs"
