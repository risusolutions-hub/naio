[package]
name = "niao_feed"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "RSS / Atom / JSON Feed parse + generate for Niao"

[lib]
bench = false

[dependencies]
feed-rs = "2.3"
chrono = { version = "=0.4.39", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
niao_parallel = { workspace = true }
niao_encoding = { workspace = true }
niao_sanitize = { workspace = true }

[[bin]]
name = "nfeed_bench"
path = "src/bin/nfeed_bench.rs"
